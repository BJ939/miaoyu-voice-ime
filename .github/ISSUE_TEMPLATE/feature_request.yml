name: 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        妙语坚持「全本地、离线、原创轻量」的方向：不联网、不上传音频。与这个方向冲突的建议可能不会被采纳。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题 / 使用场景
      placeholder: 我在 … 的时候，希望能 …
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你希望怎么解决
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案 / 其它软件的做法
  - type: checkboxes
    id: offline
    attributes:
      label: 确认
      options:
        - label: 这个建议不需要联网即可使用
