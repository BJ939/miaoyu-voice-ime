name: Bug 报告
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请确认：
        - 已搜索现有 Issue，没有重复；
        - 日志/截图里**不要包含识别文本、个人路径、账号等隐私内容**。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 例如 v0.1.0 full 包 / 从源码运行（附 commit）
    validations:
      required: true
  - type: dropdown
    id: run_mode
    attributes:
      label: 运行方式
      options:
        - EXE（Release 包）
        - 从源码运行
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 系统
      description: 例如 Windows 11 23H2 x64 / Windows 10 22H2 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动程序 …
        2. 按 Ctrl+Alt+Space …
        3. 出现 …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志（已脱敏）
      description: 日志位置：程序目录下 `logs\app.log`。请先删除识别文本、路径、账号等隐私内容。
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: 确认
      options:
        - label: 我确认提交内容中不包含识别文本、个人路径、密钥等隐私信息
          required: true
